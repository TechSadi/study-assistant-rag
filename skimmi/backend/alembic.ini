# Alembic migrations for Skimmi AI's relational database.
# The database URL comes from DATABASE_URL (app/config.py), never from this file.
#   cd skimmi/backend && alembic upgrade head      # also run automatically at startup (SKIMMI_AUTO_MIGRATE)
#   cd skimmi/backend && alembic revision -m "..."  # new migration in migrations/versions

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
